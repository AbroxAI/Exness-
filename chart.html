:root{

*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;min-width:0;
  background:#fff;color:#303030;
  font-family:RobotoCondensed,"Arial Narrow",Roboto,Arial,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;overflow:hidden;
}
body{display:block}
.stage{
  position:relative;width:min(var(--w),100vw);
  height:calc(var(--h) * var(--scale));
  margin:0 auto;background:#fff;overflow:hidden;
}
.screen{
  position:absolute;left:0;top:0;width:var(--w);height:var(--h);
  transform:scale(var(--scale));transform-origin:top left;
  background:#fff;overflow:hidden;
}

/* Header */
.header{
  position:absolute;left:0;top:0;width:732px;height:106px;
  background:#fff;border-bottom:1px solid #dedede;
}
.menu{
  position:absolute;left:19px;top:39px;width:35px;height:27px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:10;
}
.menu span{
  display:block;height:4px;margin-bottom:5px;
  background:#202020;border-radius:1px;
}

/* Tool icons are kept visually close to the supplied app shell. */
.crosshair{
  position:absolute;left:319px;top:34px;width:38px;height:38px;
  opacity:.90;color:#555;
}
.crosshair:before,.crosshair:after{
  content:"";position:absolute;background:#555;border-radius:1px;
}
.crosshair:before{width:2px;height:38px;left:18px;top:0}
.crosshair:after{width:38px;height:2px;left:0;top:18px}
.crosshair i,.crosshair b{
  position:absolute;display:block;background:#555;
}
.crosshair i{width:2px;height:12px;left:18px;top:-7px}
.crosshair b{width:12px;height:2px;left:-7px;top:18px}
.crosshair em,.crosshair strong{
  position:absolute;display:block;background:#555;
}
.crosshair em{width:2px;height:8px;left:18px;bottom:-5px}
.crosshair strong{width:8px;height:2px;right:-5px;top:18px}

.fn{
  position:absolute;left:419px;top:28px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:36px;line-height:44px;font-style:italic;

}
.chart-tool{
  position:absolute;left:518px;top:29px;width:43px;height:42px;
  opacity:.90;color:#555;
}
.chart-tool:before{
  content:"";position:absolute;left:2px;top:8px;width:34px;height:24px;
  border:3px solid #555;border-radius:2px;
}
.chart-tool:after{
  content:"";position:absolute;left:21px;top:2px;width:16px;height:16px;
  border:3px solid #555;border-left:0;border-bottom:0;
  transform:rotate(12deg);border-radius:1px;
}
.account{
  position:absolute;right:24px;top:29px;width:44px;height:43px;opacity:.90;
}
.account:before{
  content:"";position:absolute;left:1px;top:5px;width:17px;height:21px;
  border:3px solid #666;border-radius:1px;transform:skewX(-7deg);
}
.account:after{
  content:"";position:absolute;left:20px;top:17px;width:18px;height:18px;
  border:3px solid #666;border-radius:3px;transform:rotate(-8deg);
}
.account span{
  position:absolute;left:28px;top:7px;width:11px;height:11px;
  border:3px solid #666;border-radius:50%;
}

/* Chart */

  background:#fff;overflow:hidden;
}
.chart-svg{position:absolute;left:0;top:0;width:732px;height:916px;display:block}
.chart-meta{
  position:absolute;left:11px;top:18px;z-index:3;
  line-height:1;
}
.symbol{
  font-size:20px;font-weight:700;color:#117bc5;letter-spacing:.1px;
}
.symbol .caret{font-size:13px;color:#117bc5;margin-left:3px;position:relative;top:-1px}
.timeframe{
  font-size:18px;font-weight:400;color:#2f2f2f;margin-left:5px;
}
.desc{
  margin-top:8px;font-size:16px;color:#353535;font-weight:400;
}
.current-pill{
  position:absolute;right:0;top:361px;width:103px;height:40px;
  background:#2FAF9F;color:#fff;border-radius:5px 0 0 5px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:40px;font-weight:500;letter-spacing:.1px;
  z-index:5;
}
.current-tail{
  position:absolute;right:103px;top:380px;width:0;height:0;
  border-top:1px solid transparent;
}

/* RSI */
.rsi-wrap{
  position:absolute;left:0;top:1022px;width:732px;height:358px;
  background:#fff;overflow:hidden;border-top:1px solid #ededed;
}
.rsi-svg{position:absolute;left:0;top:0;width:732px;height:358px;display:block}
.rsi-caption{
  position:absolute;left:10px;top:10px;

/* Bottom navigation: screenshot uses five visible app destinations. */
.nav{
  position:fixed;left:50%;bottom:0;width:732px;height:92px;
  transform:translateX(-50%) scale(var(--scale));transform-origin:center bottom;
  background:#f7f7f7;border-top:1px solid #ededed;
  z-index:99999;display:block;visibility:visible;opacity:1;
}
.nav-item{position:absolute;top:0;width:70px;height:92px;display:block;color:#707070;cursor:pointer;z-index:100000;-webkit-tap-highlight-color:transparent;user-select:none}
.nav-item svg{position:absolute;display:block;overflow:visible;pointer-events:none;user-select:none;-webkit-user-drag:none;opacity:.9}
.nav-item.active{color:#3F9FE8}
.nav-item.active svg{opacity:1}
