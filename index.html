<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ARMORBOT ELITE — Dashboard Replica</title>
<style>
  :root{
    --w:732px;
    --ink:#505050;
    --text:#303030;
    --light:#919191;
    --line:#e7e7e7;
    --blue:#2188c3;
    --red:#b43132;
    --green:#75b91c;
    --nav:#f7f7f7;
    --icon:#666666;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#d9d9d9;font-family:Roboto,Arial,sans-serif;color:var(--text)}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
  .screen{width:var(--w);min-height:1536px;background:#fff;overflow:hidden;position:relative}
  .header{height:106px;display:flex;align-items:flex-start;position:relative;background:#fff}
  .menu{position:absolute;left:18px;top:38px;width:34px;height:27px}
  .menu span{display:block;height:4px;background:#222;margin-bottom:5px;border-radius:1px}
  .header-title{position:absolute;left:71px;top:18px;line-height:1}
  .history{font-size:24px;font-weight:400;margin-bottom:10px}
  .symbols{font-size:27px;font-weight:400}
  .header-icons{position:absolute;right:20px;top:26px;display:flex;align-items:center;gap:52px;color:#555}
  .header-icons svg{display:block;width:39px;height:39px;overflow:visible}

  .summary{padding-top:8px;height:203px;border-bottom:1px solid #ededed}
  .sumrow{height:46px;display:flex;align-items:center;padding:0 22px 0 24px;font-size:25px;line-height:1}
  .sumrow .label{font-weight:700;color:#555;white-space:nowrap}
  .sumrow .leader{flex:1 1 auto;border-bottom:5px dotted #e2e2e2;margin:0 14px 1px 14px;transform:translateY(1px)}
  .sumrow .value{font-weight:600;color:#111;white-space:nowrap;min-width:138px;text-align:right}
  .sumrow.profit .value{color:var(--blue);font-weight:700}
  .sumrow.withdrawal .value{color:#111;font-weight:600}

  .balance-entry{height:90px;border-bottom:1px solid #ececec;position:relative;padding:14px 24px}
  .balance-entry .label{font-size:26px;font-weight:700;color:#555}
  .balance-entry .date{position:absolute;right:26px;top:17px;font-size:22px;color:#8e8e8e}
  .balance-entry .amount{position:absolute;right:26px;top:48px;font-size:24px;font-weight:700;color:var(--red)}

  .trades{position:relative;padding-bottom:95px}
  .trade{position:relative;border-bottom:1px solid #e3e3e3;background:#fff}
  .trade.expanded{height:234px}
  .trade.compact{height:88px}
  .trade .accent{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--green)}
  .trade-main{position:absolute;left:24px;right:23px;top:12px}
  .trade-title{font-size:25px;line-height:28px;font-weight:700;white-space:nowrap}
  .trade-title .action{color:var(--red);font-weight:500}
  .prices{font-size:25px;line-height:31px;color:#8a8a8a;font-weight:500;white-space:nowrap}
  .date{position:absolute;right:0;top:9px;color:#8a8a8a;font-size:20px;line-height:24px;white-space:nowrap}
  .profit{position:absolute;right:0;top:43px;color:var(--blue);font-size:23px;line-height:24px;font-weight:700}
  .meta{position:absolute;left:24px;right:24px;top:92px;display:grid;grid-template-columns: 1fr 1fr;column-gap:45px;row-gap:10px;font-size:21px;color:#969696}
  .meta .cell{display:flex;justify-content:space-between;white-space:nowrap}
  .meta .k{font-weight:500}
  .meta .v{color:#909090}

  /* Reference screenshot has SIX bottom-nav icons. The SVG paths remain inline so GitHub Pages needs no external assets. */
  .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:732px;height:92px;background:var(--nav);display:grid;grid-template-columns:repeat(6,1fr);align-items:center;border-top:1px solid #efefef;z-index:20}
  .nav-item{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .nav-item svg{width:46px;height:46px;display:block;color:#656565;overflow:visible}
  .nav-item.active svg{color:#4aa8df}
  
  @media (max-width: 732px){
    body{background:#fff}
    .screen{width:100vw;min-height:calc(100vw * 1536 / 732);transform-origin:top left}
    .nav{width:100vw}
  }
</style>
</head>
