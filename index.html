<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ARMORBOT ELITE — Dashboard Replica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
  :root{
    --w:732px;
    --ink:#505050;
    --text:#303030;
    --light:#919191;
    --line:#e7e7e7;
    --blue:#2188c3;
    --red:#b43132;
    --green:#75b91c;
    --nav:#f7f7f7;
    --icon:#666666;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;font-family:Roboto,Arial,sans-serif;color:var(--text);font-synthesis:none}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
  .screen{width:var(--w);min-height:1536px;background:#fff;overflow:hidden;position:relative}
  .header{height:106px;display:flex;align-items:flex-start;position:relative;background:#fff}
  .menu{position:absolute;left:18px;top:38px;width:34px;height:27px}
  .menu span{display:block;height:4px;background:#222;margin-bottom:5px;border-radius:1px}
  .header-title{position:absolute;left:71px;top:18px;line-height:1}
  .history{font-size:24px;font-weight:400;margin-bottom:10px}
  .symbols{font-size:27px;font-weight:400}
  .header-icons{position:absolute;left:0;right:0;top:0;height:100%;display:block;color:#555}
  .header-icons svg{position:absolute;display:block;overflow:visible}


  .header-icons svg:nth-child(1){left:479px;top:32px;width:43px;height:37px}
  .header-icons svg:nth-child(2){left:573px;top:34px;width:40px;height:33px}
  .header-icons svg:nth-child(3){left:664px;top:28px;width:42px;height:43px}

  .summary{padding-top:8px;height:203px;border-bottom:1px solid #ededed}
  .sumrow{height:44px;display:flex;align-items:center;padding:0 22px 0 24px;font-size:24px;line-height:1;font-weight:400}
  .sumrow .label{font-weight:500;color:#555;white-space:nowrap}
  .sumrow .leader{flex:1 1 auto;border-bottom:4px dotted #e2e2e2;margin:0 14px 1px 14px;transform:translateY(1px)}
  .sumrow .value{font-weight:500;color:#111;white-space:nowrap;min-width:138px;text-align:right}
  .sumrow.profit .value{color:var(--blue);font-weight:700}
  .sumrow.withdrawal .value{color:#111;font-weight:400}

  .balance-entry{height:90px;border-bottom:1px solid #ececec;position:relative;padding:14px 24px}
  .balance-entry .label{font-size:25px;font-weight:500;color:#555}
  .balance-entry .date{position:absolute;right:26px;top:17px;font-size:22px;color:#8e8e8e}
  .balance-entry .amount{position:absolute;right:26px;top:48px;font-size:24px;font-weight:600;color:var(--red)}

  .trades{position:relative;padding-bottom:95px}
  .trade{position:relative;border-bottom:1px solid #e3e3e3;background:#fff}
  .trade.expanded{height:234px}
  .trade.compact{height:88px}
  .trade .accent{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--green)}
  .trade-main{position:absolute;left:24px;right:23px;top:12px}
  .trade-title{font-size:24px;line-height:28px;font-weight:500;white-space:nowrap}
  .trade-title .action{color:var(--red);font-weight:500}
  .prices{font-size:24px;line-height:31px;color:#8a8a8a;font-weight:400;white-space:nowrap}
  .date{position:absolute;right:0;top:9px;color:#8a8a8a;font-size:20px;line-height:24px;font-weight:400;white-space:nowrap}
  .profit{position:absolute;right:0;top:43px;color:var(--blue);font-size:23px;line-height:24px;font-weight:600}
  .meta{position:absolute;left:24px;right:24px;top:92px;display:grid;grid-template-columns: 1fr 1fr;column-gap:45px;row-gap:10px;font-size:21px;color:#969696}
  .meta .cell{display:flex;justify-content:space-between;white-space:nowrap}
  .meta .k{font-weight:400}
  .meta .v{color:#909090}

  /* Reference screenshot has SIX bottom-nav icons. The SVG paths remain inline so GitHub Pages needs no external assets. */
  .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:732px;height:91px;background:#f7f7f7;border-top:1px solid #efefef;z-index:20}
  .nav-item{position:absolute;top:0;width:0;height:91px;display:block}
  .nav-item svg{position:absolute;display:block;overflow:visible}
  .nav-item.active svg{color:#409cf0}
  

  .nav-item:nth-child(1){left:51px}.nav-item:nth-child(1) svg{left:0;top:24px;width:44px;height:32px}
  .nav-item:nth-child(2){left:168px}.nav-item:nth-child(2) svg{left:0;top:20px;width:46px;height:39px}
  .nav-item:nth-child(3){left:286px}.nav-item:nth-child(3) svg{left:0;top:21px;width:44px;height:41px}
  .nav-item:nth-child(4){left:403px}.nav-item:nth-child(4) svg{left:0;top:21px;width:44px;height:40px}
  .nav-item:nth-child(5){left:520px}.nav-item:nth-child(5) svg{left:0;top:20px;width:46px;height:44px}
  .nav-item:nth-child(6){left:622px}.nav-item:nth-child(6) svg{left:0;top:20px;width:44px;height:42px}

  @media (max-width: 732px){
    body{background:#fff}
    .screen{width:100vw;min-height:calc(100vw * 1536 / 732);transform-origin:top left}
    .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:732px;height:91px;background:#f7f7f7;border-top:1px solid #efefef;z-index:20}
  }
</style>
</head>
<body>
<div class="screen">
  <!-- Header reconstructed from the reference: menu + two-line title + three inline SVG glyphs. -->
  <header class="header">
    <div class="menu" aria-hidden="true"><span></span><span></span><span></span></div>

  </header>

  <!-- Four-row financial summary with a dotted flex leader between label and value. -->
  <section class="summary">
    <div class="sumrow profit"><span class="label">Profit:</span><span class="leader"></span><span class="value">5 298.86</span></div>
    <div class="sumrow"><span class="label">Deposit:</span><span class="leader"></span><span class="value">500.00</span></div>
    <div class="sumrow withdrawal"><span class="label">Withdrawal:</span><span class="leader"></span><span class="value">-5 798.86</span></div>
    <div class="sumrow"><span class="label">Balance:</span><span class="leader"></span><span class="value">0.00</span></div>
  </section>

  <section class="balance-entry">
    <div class="label">Balance</div>
    <div class="date">2026.07.07 21:58:45</div>
    <div class="amount">-5 798.86</div>
  </section>

  <!-- Trade history: one expanded record followed by compact records. -->
  <main class="trades">
    <article class="trade expanded">
      <div class="accent"></div>
      <div class="trade-main">
        <div class="trade-title">AUDCADm, <span class="action">sell 0.01</span></div>
        <div class="prices">0.98723 → 0.98392</div>
        <div class="date">2026.07.07 19:07:15</div>
        <div class="profit">2.33</div>
      </div>
      <div class="meta">
        <div class="cell"><span class="k">S/L:</span><span class="v">0.98897</span></div><div class="cell"><span class="k">Swap:</span><span class="v">0.00</span></div>
        <div class="cell"><span class="k">T/P:</span><span class="v">0.98392</span></div><div class="cell"><span class="k">Taxes:</span><span class="v">0.00</span></div>
        <div class="cell"><span class="k">ID:</span><span class="v">379006544</span></div><div class="cell"><span class="k">Commission:</span><span class="v">0.00</span></div>
      </div>
    </article>

    <script>
      const rows=[
        '0.98723','0.98722','0.98722','0.98722','0.98722','0.98722','0.98722','0.98722','0.98722','0.98722','0.98722'
      ];
      document.write(rows.map(p=>`<article class="trade compact"><div class="trade-main"><div class="trade-title">AUDCADm, <span class="action">sell 0.01</span></div><div class="prices">${p} → 0.98392</div><div class="date">2026.07.07 19:07:15</div><div class="profit">2.33</div></div></article>`).join(''));
    </script>
  </main>
